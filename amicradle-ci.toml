# amicradle-ci: the AmiCradle Team's local CI. MIT, Copyright (c) 2026 AmiCradle Team.
schema = 1
repo = "amigaopenttd"

[stove]
name = "os32-gcc16"
version = "16.2.0-open8"

[test]
host = ["python3 -B package/tests/test_package.py", "python3 -m unittest discover -s tests"]

[build]
entry = "package/build-amiga.sh"

[paths]
skip = ["*.md", "docs/*", "LICENSE", "receipts/*"]
