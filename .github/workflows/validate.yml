name: Validate

on:
  push:
  pull_request:

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/game_port_prepare.py check --game all
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile scripts/game_port_prepare.py scripts/import_original_ttd.py scripts/stage_open_basesets.py
      - run: bash -n build-host.sh build-amigaos3.sh
