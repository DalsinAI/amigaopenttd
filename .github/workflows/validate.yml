name: Validate

on:
  push:
  pull_request:

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/game_port_prepare.py check --game all
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n build-host.sh build-amigaos3.sh
